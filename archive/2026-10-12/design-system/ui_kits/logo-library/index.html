<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AA CLUB · Logo Library</title>
  <link rel="stylesheet" href="../../colors_and_type.css" />
  <style>
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg1); font-family: var(--font-body-kr); }
    .stage { max-width: 1200px; margin: 0 auto; padding: 64px 56px 96px; }
    .top-rule { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--aa-black); padding-bottom: 10px; }
    .h-hero { margin-top: 40px; font-family: var(--font-display); font-weight: 300; font-size: 64px; letter-spacing: -0.03em; line-height: 1; }
    .h-hero em { font-style: italic; }
    .hero-sub { margin-top: 14px; font-family: var(--font-body-kr); font-size: 14px; color: var(--fg2); max-width: 640px; line-height: 1.6; }

    .sect { margin-top: 80px; }
    .sect-head { display: grid; grid-template-columns: 60px 1fr auto; gap: 24px; align-items: baseline; border-top: 2px solid var(--aa-black); padding-top: 14px; margin-bottom: 28px; }
    .sect-num { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.14em; color: var(--fg3); }
    .sect-title { font-family: var(--font-display); font-weight: 400; font-style: italic; font-size: 32px; letter-spacing: -0.01em; line-height: 1; }
    .sect-kr { font-family: var(--font-body-kr); font-size: 13px; color: var(--fg2); }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

    .card {
      background: var(--surface); border: 1px solid var(--line);
      display: flex; flex-direction: column;
    }
    .card-head {
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 14px 20px; border-bottom: 1px solid var(--line);
    }
    .card-id {
      display: inline-block; background: var(--aa-black); color: var(--aa-off-white);
      padding: 3px 8px; font-family: var(--font-eyebrow); font-weight: 700; font-size: 10px; letter-spacing: 0.18em;
    }
    .card-title { font-family: var(--font-display); font-size: 15px; }
    .previews { display: grid; grid-template-columns: 1fr 1fr; }
    .prev { padding: 32px 20px; display: flex; align-items: center; justify-content: center; min-height: 160px; }
    .prev-light { background: var(--aa-off-white); border-right: 1px solid var(--line); }
    .prev-dark { background: var(--aa-black); color: var(--aa-off-white); }
    .card-body { padding: 14px 20px; border-top: 1px solid var(--line); font-family: var(--font-body-kr); font-size: 12px; color: var(--fg2); }
    .card-body .row { display: flex; gap: 8px; margin-bottom: 4px; }
    .card-body .lbl { font-family: var(--font-eyebrow); font-size: 10px; font-weight: 700; letter-spacing: 0.14em; color: var(--fg3); width: 60px; }
    .btns { padding: 12px 20px 16px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .btns-header { padding: 0 20px; font-family: var(--font-eyebrow); font-size: 10px; letter-spacing: 0.18em; font-weight: 700; color: var(--fg3); text-transform: uppercase; padding-top: 12px; }

    .btn-dl {
      border: 1px solid var(--aa-black); background: var(--aa-white); color: var(--aa-black);
      padding: 9px 6px; font-family: var(--font-eyebrow); font-weight: 700; font-size: 10px;
      letter-spacing: 0.14em; text-transform: uppercase; border-radius: 0;
      transition: background 100ms, color 100ms; cursor: pointer; text-align: center;
    }
    .btn-dl:hover { background: var(--aa-black); color: var(--aa-off-white); }
    .btn-dl small { display: block; font-size: 8px; letter-spacing: 0.1em; opacity: 0.7; margin-top: 2px; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="top-rule">
      <div style="font-family: var(--font-eyebrow); font-size: 11px; letter-spacing: 0.24em; font-weight: 700; text-transform: uppercase;">Logo Selection · 10 Candidates</div>
      <div style="font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; color: var(--fg3);">FRAUNCES 300 · -0.02em</div>
    </div>

    <div class="h-hero">Logo<br /><em>library</em>.</div>
    <div class="hero-sub">
      가로형(H1–H4), 스택형(S1–S2), 축약형(SF1–SF4) — 총 10종 후보.
      모두 Fraunces 세리프 300 weight · "Athlete"만 이탤릭.
      Black / Navy / White — SVG + PNG 3000px 다운로드.
    </div>

    <div id="root"></div>
  </div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="LogoBuilder.jsx"></script>
  <script type="text/babel" src="LogoCard.jsx"></script>
  <script type="text/babel">
    const { useState } = React;

    function LogoLibrary() {
      const horizontal = [
        { id: 'H1', name: 'Horizontal + FOR ATHLETE Tag', note: '풀 워드마크 + 태그 (아래)', use: '웹 헤더, 명함 앞면, 유니폼', primary: true, render: LogoRenderers.H1 },
        { id: 'H2', name: 'Clean One Line (no tag)', note: '워드마크만', use: '문서 헤더, 이메일 서명', render: LogoRenderers.H2 },
        { id: 'H3', name: 'Inline Tag Lockup', note: '워드마크 + 태그 (오른쪽)', use: '풀-폭 배너, 유니폼 등판', render: LogoRenderers.H3 },
        { id: 'H4', name: 'Compact with AA Divider', note: '워드마크 + | + AA CLUB', use: 'SNS 프로필, 앱 스플래시', render: LogoRenderers.H4 },
      ];
      const stacked = [
        { id: 'S1', name: 'Two Lines + Tag', note: '스택 + 태그', use: '포스터, SNS 정사각, 배번', render: LogoRenderers.S1 },
        { id: 'S2', name: 'Two Lines (no tag)', note: '스택만', use: '내부 훈련 자료 표지', render: LogoRenderers.S2 },
      ];
      const shortform = [
        { id: 'SF1', name: 'AA Club (Primary Short)', note: '본 워드마크와 동일 조판', use: '명함 뒷면, 아바타, 서명', primary: true, render: LogoRenderers.SF1 },
        { id: 'SF2', name: 'AA Club Horizontal', note: '가로 컴팩트', use: '웹 헤더, 좁은 사인', render: LogoRenderers.SF2 },
        { id: 'SF3', name: 'AA Club + Seoul · Est. 2026', note: '로케이터 병기', use: '유니폼 자수, 신분증', render: LogoRenderers.SF3 },
        { id: 'SF4', name: 'AA CLUB (All Caps)', note: '전부 대문자, 자간 넓힘', use: '파비콘, 앱 아이콘', render: LogoRenderers.SF4 },
      ];

      const Section = ({ num, title, kr, list, code }) => (
        <div className="sect">
          <div className="sect-head">
            <div className="sect-num">{num}</div>
            <div>
              <div className="sect-title">{title}</div>
              <div className="sect-kr">{kr}</div>
            </div>
            <div style={{ fontFamily: 'var(--font-mono)', fontSize: 10, color: 'var(--fg3)' }}>{code}</div>
          </div>
          <div className="grid-2">
            {list.map(it => <LogoCard key={it.id} {...it} />)}
          </div>
        </div>
      );

      return (
        <>
          <Section num="01 / 03" title="Horizontal" kr="가로형 워드마크 (H1–H4)" list={horizontal} code="4 CANDIDATES" />
          <Section num="02 / 03" title="Stacked" kr="스택형 워드마크 (S1–S2)" list={stacked} code="2 CANDIDATES" />
          <Section num="03 / 03" title="Short Form" kr="축약형 (SF1–SF4)" list={shortform} code="4 CANDIDATES" />
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<LogoLibrary />);
  </script>
</body>
</html>
