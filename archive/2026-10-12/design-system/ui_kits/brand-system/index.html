<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AA CLUB · Brand System — Mood 04 Hybrid</title>
  <link rel="stylesheet" href="../../colors_and_type.css" />
  <style>
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg1); font-family: var(--font-body-kr); }
    .stage { max-width: 1280px; margin: 0 auto; padding: 64px 56px 96px; }

    /* Top rule + eyebrow */
    .top-rule {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 2px solid var(--aa-black);
      padding-bottom: 10px;
    }
    .top-eyebrow { font-family: var(--font-eyebrow); font-size: 11px; letter-spacing: 0.24em; font-weight: 700; text-transform: uppercase; }
    .top-code { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; color: var(--fg3); }

    /* Cover */
    .cover-word {
      margin-top: 40px;
      font-family: var(--font-display); font-weight: 300;
      font-size: 128px; letter-spacing: -0.03em; line-height: 0.9;
    }
    .cover-word em { font-style: italic; font-weight: 300; }
    .cover-tags { margin-top: 32px; display: flex; align-items: center; gap: 16px; }

    /* Section head */
    .sect { margin-top: 88px; }
    .sect-head {
      display: grid; grid-template-columns: 60px 1fr auto; gap: 24px; align-items: baseline;
      border-top: 2px solid var(--aa-black); padding-top: 14px; margin-bottom: 28px;
    }
    .sect-num { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.14em; color: var(--fg3); }
    .sect-title { font-family: var(--font-display); font-weight: 400; font-style: italic; font-size: 32px; letter-spacing: -0.01em; line-height: 1; }
    .sect-kr { font-family: var(--font-body-kr); font-size: 13px; color: var(--fg2); }

    /* Grids */
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .grid-app { display: grid; grid-template-columns: 1.2fr 1fr 0.9fr; gap: 20px; }

    /* Bottom footer */
    .foot {
      margin-top: 96px;
      display: grid; grid-template-columns: 1fr auto 100px; gap: 40px; align-items: end;
      border-top: 1px solid var(--line); padding-top: 20px;
    }
  </style>
</head>
<body>
  <div class="stage">
    <!-- COVER -->
    <div class="top-rule">
      <div class="top-eyebrow">Mood 04 — Editorial × Club</div>
      <div class="top-code">NO. 004 / SS26 · SEOUL</div>
    </div>

    <div class="cover-word">
      <img src="../../assets/logos/AA-CLUB_MAIN_black_1x.png" alt="Athletics Athlete Club" style="display:block;width:100%;max-width:900px;height:auto">
    </div>

    <div class="cover-tags">
      <div class="tag-for-athlete">FOR ATHLETE.</div>
      <div style="font-family: var(--font-body-kr); font-size: 14px; color: var(--fg2);">선수를 위해.</div>
    </div>

    <div id="root"></div>
  </div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="ColorBoard.jsx"></script>
  <script type="text/babel" src="PillarsBoard.jsx"></script>
  <script type="text/babel" src="ApplicationsBoard.jsx"></script>
  <script type="text/babel">
    const { useState } = React;

    function BrandSystem() {
      return (
        <>
          <ColorBoard />
          <PillarsBoard />
          <ApplicationsBoard />

          <div className="foot">
            <div>
              <div className="top-eyebrow" style={{ color: 'var(--fg3)', fontSize: 10, marginBottom: 8 }}>DEFINITION · 정의</div>
              <div style={{ fontFamily: 'var(--font-body-kr)', fontSize: 13, lineHeight: 1.7 }}>
                AA CLUB은 육상 선수를 위한<br />피드백, 트레이닝, 소속,<br />매니지먼트 클럽입니다.
              </div>
            </div>
            <div style={{ fontFamily: 'var(--font-display)', fontStyle: 'italic', fontWeight: 300, fontSize: 20, lineHeight: 1.4 }}>
              "선수가 이미 속한 환경을 존중하며,<br />더 좋은 훈련 방향과 피드백을 제공하고,<br />함께 달릴 수 있는 울타리를 만듭니다."
            </div>
            <div style={{ textAlign: 'right', fontFamily: 'var(--font-mono)', fontSize: 10, letterSpacing: '0.14em', color: 'var(--fg3)', lineHeight: 1.6 }}>
              LAT 37.55<br />LON 126.97<br />EST. 2026
            </div>
          </div>
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<BrandSystem />);
  </script>
</body>
</html>
