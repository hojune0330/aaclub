<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg1); }
  .card-root { padding: 20px 24px; box-sizing: border-box; }
  .row { display: flex; gap: 10px; align-items: stretch; }
  .swatch { width: 76px; height: 76px; display: flex; align-items: flex-end; padding: 6px; box-sizing: border-box; font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.06em; }
  .lbl { font-family: var(--font-eyebrow); font-size: 9px; letter-spacing: 0.2em; font-weight: 700; text-transform: uppercase; color: var(--fg3); margin-top: 6px; }
  .txt-kr { font-family: var(--font-body-kr); font-size: 11px; color: var(--fg2); margin-top: 2px; }
</style></head><body><div class="card-root">
    <div style="display:flex; align-items:flex-end; gap:14px;">

        <div style="text-align:center;">
          <div style="width:4px; height:4px; background:#0A0A0A;"></div>
          <div style="margin-top:6px; font-family:var(--font-eyebrow); font-size:9px; letter-spacing:0.14em; font-weight:700; text-transform:uppercase;">xs</div>
          <div style="font-family:var(--font-mono); font-size:10px; color:var(--fg3);">4px</div>
        </div>

        <div style="text-align:center;">
          <div style="width:8px; height:8px; background:#0A0A0A;"></div>

          <div style="font-family:var(--font-mono); font-size:10px; color:var(--fg3);">8px</div>
        </div>

        <div style="text-align:center;">
          <div style="width:16px; height:16px; background:#0A0A0A;"></div>
          <div style="margin-top:6px; font-family:var(--font-eyebrow); font-size:9px; letter-spacing:0.14em; font-weight:700; text-transform:uppercase;">m</div>
          <div style="font-family:var(--font-mono); font-size:10px; color:var(--fg3);">16px</div>
        </div>

        <div style="text-align:center;">
          <div style="width:24px; height:24px; background:#0A0A0A;"></div>
          <div style="margin-top:6px; font-family:var(--font-eyebrow); font-size:9px; letter-spacing:0.14em; font-weight:700; text-transform:uppercase;">l</div>
          <div style="font-family:var(--font-mono); font-size:10px; color:var(--fg3);">24px</div>
        </div>

        <div style="text-align:center;">
          <div style="width:40px; height:40px; background:#0A0A0A;"></div>
          <div style="margin-top:6px; font-family:var(--font-eyebrow); font-size:9px; letter-spacing:0.14em; font-weight:700; text-transform:uppercase;">xl</div>
          <div style="font-family:var(--font-mono); font-size:10px; color:var(--fg3);">40px</div>
        </div>

        <div style="text-align:center;">
          <div style="width:64px; height:64px; background:#0A0A0A;"></div>
          <div style="margin-top:6px; font-family:var(--font-eyebrow); font-size:9px; letter-spacing:0.14em; font-weight:700; text-transform:uppercase;">2xl</div>
          <div style="font-family:var(--font-mono); font-size:10px; color:var(--fg3);">64px</div>
        </div>

    </div></div></body></html>
