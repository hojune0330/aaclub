<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg1); }
  .card-root { padding: 20px 24px; box-sizing: border-box; }
  .row { display: flex; gap: 10px; align-items: stretch; }
  .swatch { width: 76px; height: 76px; display: flex; align-items: flex-end; padding: 6px; box-sizing: border-box; font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.06em; }
  .lbl { font-family: var(--font-eyebrow); font-size: 9px; letter-spacing: 0.2em; font-weight: 700; text-transform: uppercase; color: var(--fg3); margin-top: 6px; }
  .txt-kr { font-family: var(--font-body-kr); font-size: 11px; color: var(--fg2); margin-top: 2px; }
</style></head><body><div class="card-root">
    <div style="display:flex; gap:24px; align-items:center;">

        <div style="text-align:center;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 L19 12 M13 6 L19 12 L13 18"/></svg>
          <div class="lbl" style="margin-top:6px;">ARROW</div>
        </div>

        <div style="text-align:center;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5 L12 19 M5 12 L19 12"/></svg>
          <div class="lbl" style="margin-top:6px;">PLUS</div>
        </div>

        <div style="text-align:center;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3" fill="#0A0A0A" stroke="none"/></svg>
          <div class="lbl" style="margin-top:6px;">DOT</div>
        </div>

      <div style="flex:1; padding-left:20px; border-left:1px solid var(--line);">
        <div class="lbl" style="margin:0;">UI ICONS · 24×24 · 1.25PX STROKE</div>
        <div class="txt-kr">필요 최소만. Lucide/Heroicons 등 CDN 세트 사용 금지.</div>
      </div>
    </div></div></body></html>
