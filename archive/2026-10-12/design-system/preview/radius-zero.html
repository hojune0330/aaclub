<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg1); }
  .card-root { padding: 20px 24px; box-sizing: border-box; }
  .row { display: flex; gap: 10px; align-items: stretch; }
  .swatch { width: 76px; height: 76px; display: flex; align-items: flex-end; padding: 6px; box-sizing: border-box; font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.06em; }
  .lbl { font-family: var(--font-eyebrow); font-size: 9px; letter-spacing: 0.2em; font-weight: 700; text-transform: uppercase; color: var(--fg3); margin-top: 6px; }
  .txt-kr { font-family: var(--font-body-kr); font-size: 11px; color: var(--fg2); margin-top: 2px; }
</style></head><body><div class="card-root">
    <div style="display:flex; gap:16px; align-items:center;">
      <div style="width:80px; height:80px; background:#0A0A0A;"></div>
      <div style="width:80px; height:80px; border:1px solid #0A0A0A;"></div>
      <div style="display:inline-block; background:#0A0A0A; color:#F5F3EE; padding:6px 12px; font-family:var(--font-eyebrow); font-weight:700; font-size:12px; letter-spacing:0.18em;">TAG</div>
      <div style="flex:1;">
        <div class="lbl" style="margin:0;">BORDER-RADIUS · 0</div>
        <h2 style="font-size:20px; margin:6px 0 4px;">Never round.</h2>
        <div class="txt-kr">모든 요소는 각지게 — 카드, 버튼, 태그, 이미지 프레임 전부.</div>
      </div>
    </div></div></body></html>
