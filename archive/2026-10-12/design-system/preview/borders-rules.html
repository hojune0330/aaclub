<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg1); }
  .card-root { padding: 20px 24px; box-sizing: border-box; }
  .row { display: flex; gap: 10px; align-items: stretch; }
  .swatch { width: 76px; height: 76px; display: flex; align-items: flex-end; padding: 6px; box-sizing: border-box; font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.06em; }
  .lbl { font-family: var(--font-eyebrow); font-size: 9px; letter-spacing: 0.2em; font-weight: 700; text-transform: uppercase; color: var(--fg3); margin-top: 6px; }
  .txt-kr { font-family: var(--font-body-kr); font-size: 11px; color: var(--fg2); margin-top: 2px; }
</style></head><body><div class="card-root">
    <div style="display:flex; flex-direction:column; gap:14px;">
      <div style="display:flex; align-items:center; gap:14px;">
        <div style="flex:1; border-top: 1px solid #DAD6CC; height:0;"></div>
        <div class="lbl" style="width:180px; margin:0;">1PX SOLID #DAD6CC — THIN</div>
      </div>
      <div style="display:flex; align-items:center; gap:14px;">
        <div style="flex:1; border-top: 0.5px dashed #DAD6CC; height:0;"></div>
        <div class="lbl" style="width:180px; margin:0;">0.5PX DASHED — SUB</div>
      </div>
      <div style="display:flex; align-items:center; gap:14px;">
        <div style="flex:1; border-top: 2px solid #0A0A0A; height:0;"></div>
        <div class="lbl" style="width:180px; margin:0;">2PX SOLID BLACK — STRONG</div>
      </div>
    </div></div></body></html>
