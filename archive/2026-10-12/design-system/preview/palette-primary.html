<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg1); }
  .card-root { padding: 20px 24px; box-sizing: border-box; }
  .row { display: flex; gap: 10px; align-items: stretch; }
  .swatch { width: 76px; height: 76px; display: flex; align-items: flex-end; padding: 6px; box-sizing: border-box; font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.06em; }
  .lbl { font-family: var(--font-eyebrow); font-size: 9px; letter-spacing: 0.2em; font-weight: 700; text-transform: uppercase; color: var(--fg3); margin-top: 6px; }
  .txt-kr { font-family: var(--font-body-kr); font-size: 11px; color: var(--fg2); margin-top: 2px; }
</style></head><body><div class="card-root">
    <div class="row">
      <div class="swatch" style="background:#0A0A0A;color:#F5F3EE">0A0A0A</div>
      <div class="swatch" style="background:#141414;color:#F5F3EE">141414</div>
      <div class="swatch" style="background:#0F1B3D;color:#F5F3EE">0F1B3D</div>
      <div class="swatch" style="background:#0A1230;color:#F5F3EE">0A1230</div>
      <div style="flex:1; padding-left:14px; border-left: 1px solid var(--line); margin-left: 6px; display:flex; flex-direction:column; justify-content:center;">
        <div class="lbl">PRIMARY · BLACK & NAVY</div>
        <div class="txt-kr">Black 25% · Navy 12% (max) — 태그·라벨·다크 서페이스</div>
      </div>
    </div></div></body></html>
