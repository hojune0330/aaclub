<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px 28px;background:var(--aa-off-white)}
  .head{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:10px;border-bottom:1px solid var(--aa-line);margin-bottom:24px}
  .head h2{margin:0;font-family:var(--font-display);font-style:italic;font-weight:400;font-size:22px;letter-spacing:-.02em}
  .head span{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;color:var(--aa-gray-500);text-transform:uppercase}
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;border-top:1px solid var(--aa-line);border-bottom:1px solid var(--aa-line)}
  .cell{padding:24px 20px;border-right:1px solid var(--aa-line);display:flex;flex-direction:column;align-items:center;gap:14px;background:var(--aa-off-white)}
  .cell:last-child{border-right:0}
  .cell img{max-width:100%;height:auto;display:block}
  .lbl{font-family:var(--font-mono);font-size:9px;letter-spacing:.14em;color:var(--aa-gray-500);text-transform:uppercase;text-align:center}
  .name{font-family:var(--font-eyebrow);font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
</style></head>
<body>
<div class="head"><h2>Final logo picks</h2><span>H2 · S2 · SF2 · Black</span></div>
<div class="grid">
  <div class="cell">
    <img src="../assets/logos/AA-CLUB_MAIN_black_1x.png" alt="Main" style="max-width:220px">
    <div><div class="name">MAIN · H2</div><div class="lbl">가로형 · 문서·웹·헤더</div></div>
  </div>
  <div class="cell">
    <img src="../assets/logos/AA-CLUB_STACK_black_1x.png" alt="Stack" style="max-width:140px">
    <div><div class="name">STACK · S2</div><div class="lbl">세로형 · SNS·배번·표지</div></div>
  </div>
  <div class="cell">
    <img src="../assets/logos/AA-CLUB_SHORT_black_1x.png" alt="Short" style="max-width:140px">
    <div><div class="name">SHORT · SF2</div><div class="lbl">축약형 · 파비콘·워터마크</div></div>
  </div>
</div>
</body></html>
