<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px 28px;background:var(--aa-off-white)}
  .head{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:10px;border-bottom:1px solid var(--aa-line);margin-bottom:20px}
  .head h2{margin:0;font-family:var(--font-display);font-style:italic;font-weight:400;font-size:22px;letter-spacing:-.02em}
  .head span{font-family:var(--font-eyebrow);font-size:10px;letter-spacing:.14em;color:var(--aa-gray-500);text-transform:uppercase}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--aa-line);border-bottom:1px solid var(--aa-line)}
  .cell{padding:18px 12px 20px;text-align:center;border-right:1px solid var(--aa-line);display:flex;flex-direction:column;align-items:center;gap:10px}
  .cell:last-child{border-right:0}
  .cell img{display:block;width:88px;height:88px;object-fit:contain;mix-blend-mode:multiply}
  .en{font-family:var(--font-eyebrow);font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
  .kr{font-family:var(--font-body-kr);font-size:11px;color:var(--aa-gray-700)}
</style></head>
<body>
<div class="head">
  <h2>Four Pillars</h2>
  <span>Editorial engraving · 4 pcs</span>
</div>
<div class="grid">
  <div class="cell"><img src="../../../2026-09-21/design-system-handoff/assets/icons/pillars/feedback.png" alt="Feedback"><div><div class="en">Feedback</div><div class="kr">피드백</div></div></div>
  <div class="cell"><img src="../../../2026-09-21/design-system-handoff/assets/icons/pillars/training.png" alt="Training"><div><div class="en">Training</div><div class="kr">트레이닝</div></div></div>
  <div class="cell"><img src="../../../2026-09-21/design-system-handoff/assets/icons/pillars/belonging.png" alt="Belonging"><div><div class="en">Belonging</div><div class="kr">소속</div></div></div>
  <div class="cell"><img src="../../../2026-09-21/design-system-handoff/assets/icons/pillars/management.png" alt="Management"><div><div class="en">Management</div><div class="kr">매니지먼트</div></div></div>
</div>
</body></html>
