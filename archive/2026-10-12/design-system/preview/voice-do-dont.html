<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg1); }
  .card-root { padding: 20px 24px; box-sizing: border-box; }
  .row { display: flex; gap: 10px; align-items: stretch; }
  .swatch { width: 76px; height: 76px; display: flex; align-items: flex-end; padding: 6px; box-sizing: border-box; font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.06em; }
  .lbl { font-family: var(--font-eyebrow); font-size: 9px; letter-spacing: 0.2em; font-weight: 700; text-transform: uppercase; color: var(--fg3); margin-top: 6px; }
  .txt-kr { font-family: var(--font-body-kr); font-size: 11px; color: var(--fg2); margin-top: 2px; }
</style></head><body><div class="card-root">
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">
      <div>
        <div class="lbl" style="margin:0 0 8px; color:#0A0A0A;">✓ DO</div>
        <div style="font-family:var(--font-display); font-style:italic; font-weight:300; font-size:16px; line-height:1.4;">"선수를 위해."</div>
        <div style="font-family:var(--font-body-kr); font-size:11px; color:var(--fg2); margin-top:6px;">기록만이 아니라, 방향을 봅니다.</div>
      </div>
      <div style="border-left:1px solid var(--line); padding-left:20px;">
        <div class="lbl" style="margin:0 0 8px; color:#6B6B6B;">✗ DON'T</div>
        <div style="font-family:var(--font-body-kr); font-size:13px; text-decoration:line-through; color:var(--fg3);">"압도적인 성장을 보장합니다"</div>
        <div style="font-family:var(--font-body-kr); font-size:11px; text-decoration:line-through; color:var(--fg3); margin-top:4px;">"국내 최초, 유일무이한."</div>
      </div>
    </div></div></body></html>
