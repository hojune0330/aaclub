<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px 28px;background:var(--aa-off-white)}
  .head{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:10px;border-bottom:1px solid var(--aa-line);margin-bottom:20px}
  .head h2{margin:0;font-family:var(--font-display);font-style:italic;font-weight:400;font-size:22px;letter-spacing:-.02em}
  .head span{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;color:var(--aa-gray-500);text-transform:uppercase}
  .row{display:flex;gap:20px;align-items:flex-end;padding:12px 0;border-bottom:1px solid var(--aa-line)}
  .row:last-child{border-bottom:0}
  .row img{border:1px solid var(--aa-line);image-rendering:pixelated}
  .lbl{font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;color:var(--aa-gray-500);text-transform:uppercase;margin-top:4px}
  .name{font-family:var(--font-eyebrow);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
</style></head>
<body>
<div class="head"><h2>Favicon & touch icons</h2><span>16 · 32 · 48 · 180 · 192 · 512</span></div>
<div class="row">
  <div style="text-align:center"><img src="../brand-collateral/web/favicon-16.png" width="16" height="16"><div class="lbl">16</div></div>
  <div style="text-align:center"><img src="../brand-collateral/web/favicon-32.png" width="32" height="32"><div class="lbl">32</div></div>
  <div style="text-align:center"><img src="../brand-collateral/web/favicon-48.png" width="48" height="48"><div class="lbl">48</div></div>
  <div style="text-align:center"><img src="../brand-collateral/web/apple-touch-icon.png" width="60" height="60"><div class="lbl">180 · APPLE</div></div>
  <div style="text-align:center"><img src="../brand-collateral/web/android-chrome-192.png" width="64" height="64"><div class="lbl">192 · ANDROID</div></div>
  <div style="text-align:center"><img src="../brand-collateral/web/android-chrome-512.png" width="80" height="80"><div class="lbl">512 · PWA</div></div>
</div>
</body></html>
