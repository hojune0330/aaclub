<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px 28px;background:var(--aa-off-white)}
  .head{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:10px;border-bottom:1px solid var(--aa-line);margin-bottom:20px}
  .head h2{margin:0;font-family:var(--font-display);font-style:italic;font-weight:400;font-size:22px;letter-spacing:-.02em}
  .head span{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;color:var(--aa-gray-500);text-transform:uppercase}
  .row{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--aa-line);border-bottom:1px solid var(--aa-line)}
  .cell{padding:22px;border-right:1px solid var(--aa-line);display:flex;flex-direction:column;align-items:center;gap:10px}
  .cell:last-child{border-right:0}
  .cell img{width:120px;height:120px;border-radius:50%;object-fit:cover}
  .lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;color:var(--aa-gray-500);text-transform:uppercase}
</style></head>
<body>
<div class="head"><h2>Social avatars</h2><span>400 × 400 · circle-safe</span></div>
<div class="row">
  <div class="cell"><img src="../brand-collateral/web/avatar-black-on-offwhite.png"><div class="lbl">Black · off-white</div></div>
  <div class="cell"><img src="../brand-collateral/web/avatar-white-on-ink.png"><div class="lbl">White · ink</div></div>
  <div class="cell"><img src="../brand-collateral/web/avatar-navy-on-offwhite.png"><div class="lbl">Navy · off-white</div></div>
</div>
</body></html>
