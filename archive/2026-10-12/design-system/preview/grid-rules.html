<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg1); }
  .card-root { padding: 20px 24px; box-sizing: border-box; }
  .row { display: flex; gap: 10px; align-items: stretch; }
  .swatch { width: 76px; height: 76px; display: flex; align-items: flex-end; padding: 6px; box-sizing: border-box; font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.06em; }
  .lbl { font-family: var(--font-eyebrow); font-size: 9px; letter-spacing: 0.2em; font-weight: 700; text-transform: uppercase; color: var(--fg3); margin-top: 6px; }
  .txt-kr { font-family: var(--font-body-kr); font-size: 11px; color: var(--fg2); margin-top: 2px; }
</style></head><body><div class="card-root">
    <div style="display:flex; gap:20px; align-items:center;">
      <div style="width:200px; height:100px; background:linear-gradient(to right, #F5F3EE 0, #F5F3EE 100%); background-image: repeating-linear-gradient(to right, #DAD6CC 0, #DAD6CC 1px, transparent 1px, transparent calc(100% / 12)); border:1px solid var(--line);"></div>
      <div style="flex:1;">
        <div class="lbl" style="margin:0;">12 · COLUMN GRID</div>
        <h2 style="font-size:18px; margin:4px 0;">Wide margins.</h2>
        <div class="txt-kr">데스크탑 좌우 패딩 최소 48px — 컨텐츠보다 여백을 넓게 (에디토리얼 원칙).</div>
      </div>
    </div></div></body></html>
