<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg1); }
  .card-root { padding: 20px 24px; box-sizing: border-box; }
  .row { display: flex; gap: 10px; align-items: stretch; }
  .swatch { width: 76px; height: 76px; display: flex; align-items: flex-end; padding: 6px; box-sizing: border-box; font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.06em; }
  .lbl { font-family: var(--font-eyebrow); font-size: 9px; letter-spacing: 0.2em; font-weight: 700; text-transform: uppercase; color: var(--fg3); margin-top: 6px; }
  .txt-kr { font-family: var(--font-body-kr); font-size: 11px; color: var(--fg2); margin-top: 2px; }
</style></head><body><div class="card-root">
    <div style="display:flex; gap:16px; align-items:stretch;">
      <div style="flex:1; background:#F5F3EE; padding:20px; border:1px solid var(--line); display:flex; align-items:center; justify-content:center;">
        <img src="../assets/logos/AA-CLUB_SHORT_black_1x.png" alt="AA Club · SHORT SF2 black" style="display:block; width:180px; height:auto;">
      </div>
      <div style="flex:1; background:#0A0A0A; padding:20px; display:flex; align-items:center; justify-content:center;">
        <img src="../assets/logos/AA-CLUB_SHORT_white_1x.png" alt="AA Club · SHORT SF2 white" style="display:block; width:180px; height:auto;">
      </div>
    </div>
    <div class="lbl" style="margin-top:8px">SHORT · SF2 · AA CLUB HORIZONTAL</div></div></body></html>
