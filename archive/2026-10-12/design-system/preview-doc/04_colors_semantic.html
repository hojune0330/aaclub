<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../doc-tokens.css">
<style>body{margin:0;padding:20px;background:var(--paper)}
.row{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.sw{padding:16px;min-height:110px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--line);background:var(--paper)}
.chip{width:32px;height:32px}
.name{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase;margin-top:8px}
.hex{font-family:var(--font-mono);font-size:12px;color:var(--ink);margin-top:2px}
.use{font-size:11px;color:var(--ink-2);line-height:1.45;margin-top:6px}
</style></head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background:#E4E2DC"></div><div><div class="name">Line</div><div class="hex">#E4E2DC</div><div class="use">1px 헤어라인 · 테이블·섹션 구분</div></div></div>
  <div class="sw"><div class="chip" style="background:#A11F1F"></div><div><div class="name">Error (last resort)</div><div class="hex">#A11F1F</div><div class="use">꼭 필요할 때만 · 색만으로 의미를 전달하지 않기</div></div></div>
</div>
</body></html>
