<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../doc-tokens.css">
<style>body{margin:0;padding:24px;background:var(--paper)}
.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase;margin-bottom:10px}
.head{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:10px;border-bottom:1px solid var(--ink);margin-bottom:0}
.head h2{margin:0;font-size:20px;font-weight:500;letter-spacing:-.02em}
.head span{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;color:var(--ink-3)}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th,td{border-bottom:1px solid var(--line);vertical-align:middle}
th{padding:10px 8px;background:var(--surface-muted);font-family:var(--font-mono);font-size:10px;font-weight:500;letter-spacing:.08em;color:var(--ink-3);text-align:left;text-transform:uppercase}
td{padding:12px 8px;font-size:13px}
th:first-child,td:first-child{padding-left:0}
th:last-child,td:last-child{padding-right:0;text-align:right}
.rule{color:var(--ink-2)}
.amt{font-family:var(--font-mono);font-size:16px;font-weight:500;color:var(--accent);font-variant-numeric:tabular-nums}
</style></head>
<body>
<div class="lbl">Reward table</div>
<div class="head"><h2>건별 보상 기준</h2><span>AMOUNT · BEFORE TAX</span></div>
<table>
  <thead><tr><th style="width:36%">콘텐츠 유형</th><th style="width:40%">인정 기준</th><th style="width:24%">건별 보상</th></tr></thead>
  <tbody>
    <tr><td>사진 게시물 3–7장</td><td class="rule">공동게시 또는 사전 예외승인</td><td><span class="amt">15,000원</span></td></tr>
    <tr><td>일반 릴스</td><td class="rule">공동게시 또는 사전 예외승인</td><td><span class="amt">20,000원</span></td></tr>
    <tr><td>유행 챌린지 릴스</td><td class="rule">회사가 사전 지정·승인</td><td><span class="amt">25,000원</span></td></tr>
  </tbody>
</table>
</body></html>
