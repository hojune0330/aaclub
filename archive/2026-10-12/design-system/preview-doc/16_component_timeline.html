<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../doc-tokens.css">
<style>body{margin:0;padding:24px;background:var(--paper)}
.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase;margin-bottom:10px}
.timeline{border-top:1px solid var(--ink)}
.step{display:grid;grid-template-columns:56px 180px 1fr;min-height:76px;border-bottom:1px solid var(--line)}
.no{padding:14px 0;font-family:var(--font-mono);font-size:24px;line-height:1;color:var(--accent)}
.ttl{padding:14px 14px 14px 0}
.ttl strong{display:block;font-size:15px;font-weight:500}
.ttl time{display:block;margin-top:6px;font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}
.body{padding:14px 0 14px 14px;border-left:1px solid var(--line);font-size:12px;line-height:1.55;color:var(--ink-2)}
</style></head>
<body>
<div class="lbl">Procedure timeline</div>
<div class="timeline">
  <div class="step"><div class="no">01</div><div class="ttl"><strong>보상 신청</strong><time>다음 달 5일까지</time></div><div class="body">지정 신청서에 게시물 링크와 증빙 캡처를 붙여 제출합니다.</div></div>
  <div class="step"><div class="no">02</div><div class="ttl"><strong>검토·보완</strong><time>다음 달 10일까지</time></div><div class="body">회사가 검토합니다. 필요 시 1회 보완 기회를 제공합니다.</div></div>
</div>
</body></html>
