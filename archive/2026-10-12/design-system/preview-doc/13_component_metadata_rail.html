<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../doc-tokens.css">
<style>body{margin:0;padding:24px;background:var(--paper)}
.meta{display:grid;grid-template-columns:1.25fr 1.15fr 0.9fr 0.55fr;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.mi{padding:12px 12px 12px 0;border-right:1px solid var(--line);font-family:var(--font-mono);font-size:10px;line-height:1.45;letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase}
.mi+.mi{padding-left:12px}
.mi:last-child{border-right:0;text-align:right;padding-right:0}
.mi strong{display:block;color:var(--ink);font-weight:500}
.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase;margin-bottom:10px}
</style></head>
<body>
<div class="lbl">Metadata rail</div>
<div class="meta">
  <div class="mi">Document<strong>Operating Guide</strong></div>
  <div class="mi">Program<strong>AAC Content Reward</strong></div>
  <div class="mi">Audience<strong>AAC Athletes</strong></div>
  <div class="mi">Page<strong>01 / 02</strong></div>
</div>
</body></html>
