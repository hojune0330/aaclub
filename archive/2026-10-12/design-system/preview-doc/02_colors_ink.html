<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../doc-tokens.css">
<style>body{margin:0;padding:20px;background:var(--paper)}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sw{padding:16px;min-height:120px;display:flex;flex-direction:column;justify-content:space-between;color:#fff}
.sw .name{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.sw .hex{font-family:var(--font-mono);font-size:12px;margin-top:6px}
.sw .use{font-size:11px;line-height:1.4;opacity:.9}
</style></head>
<body>
<div class="row">
  <div class="sw" style="background:#0E1412"><div><div class="name">Ink</div><div class="hex">#0E1412</div></div><div class="use">헤드라인 · 본문</div></div>
  <div class="sw" style="background:#3A4340"><div><div class="name">Ink secondary</div><div class="hex">#3A4340</div></div><div class="use">리드 · 노트</div></div>
  <div class="sw" style="background:#6B7571"><div><div class="name">Ink muted</div><div class="hex">#6B7571</div></div><div class="use">메타데이터 · 캡션</div></div>
</div>
</body></html>
