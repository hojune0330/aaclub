<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../doc-tokens.css">
<style>body{margin:0;padding:20px 24px;background:var(--paper)}
.meta{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase;margin-bottom:14px}
.note{background:var(--surface-muted);padding:20px;border-left:0;border-right:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;gap:20px;align-items:center}
.bad{color:var(--ink-3);text-decoration:line-through;font-size:12px}
.good{color:var(--ink);font-size:13px;line-height:1.5}
.label{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;color:var(--accent);text-transform:uppercase}
</style></head>
<body>
<div class="meta">Depth strategy — borders only</div>
<div class="note">
  <div style="flex:1">
    <div class="label">DO</div>
    <div class="good" style="margin-top:6px">Paper · surface-muted 밴드 · 1px 규칙 라인만 사용</div>
  </div>
  <div style="width:1px;height:60px;background:var(--line)"></div>
  <div style="flex:1">
    <div class="label" style="color:var(--ink-3)">DON'T</div>
    <div class="bad" style="margin-top:6px">Box shadow · gradient · 3D · fake elevation</div>
  </div>
</div>
</body></html>
