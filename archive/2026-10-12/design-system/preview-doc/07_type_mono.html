<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../doc-tokens.css">
<style>body{margin:0;padding:24px 28px;background:var(--paper)}
.meta{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase;margin-bottom:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:20px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0}
.row+.row{border-top:none}
.k{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase}
.v{font-family:var(--font-mono);font-weight:500;color:var(--ink);margin-top:4px}
.fig{font-family:var(--font-mono);font-size:24px;font-weight:500;color:var(--accent);font-variant-numeric:tabular-nums}
</style></head>
<body>
<div class="meta">IBM Plex Mono · 메타데이터 · 숫자</div>
<div class="row">
  <div><div class="k">Program</div><div class="v" style="font-size:11px">AAC CONTENT REWARD</div></div>
  <div><div class="k">Amount</div><div class="fig">25,000원</div></div>
</div>
<div class="row">
  <div><div class="k">Doc code</div><div class="v" style="font-size:11px">AAC-CR · v1.0</div></div>
  <div><div class="k">Deadline</div><div class="v" style="font-size:13px">다음 달 15일까지</div></div>
</div>
</body></html>
