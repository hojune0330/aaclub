<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../doc-tokens.css">
<style>body{margin:0;padding:20px;background:var(--surface-muted)}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sw{border:1px solid var(--line);padding:16px;min-height:120px;display:flex;flex-direction:column;justify-content:space-between}
.sw .name{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase}
.sw .hex{font-family:var(--font-mono);font-size:12px;color:var(--ink);margin-top:6px}
.sw .use{font-size:11px;color:var(--ink-2);line-height:1.4}
</style></head>
<body>
<div class="row">
  <div class="sw" style="background:#FAFAF7"><div><div class="name">Paper</div><div class="hex">#FAFAF7</div></div><div class="use">페이지 배경 · 웜 오프화이트</div></div>
  <div class="sw" style="background:#FFFFFF"><div><div class="name">Surface</div><div class="hex">#FFFFFF</div></div><div class="use">테이블 헤더 · 선택 블록</div></div>
  <div class="sw" style="background:#F3F2EE"><div><div class="name">Surface muted</div><div class="hex">#F3F2EE</div></div><div class="use">조용한 강조 밴드</div></div>
</div>
</body></html>
