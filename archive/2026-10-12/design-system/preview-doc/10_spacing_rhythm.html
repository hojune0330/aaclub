<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../doc-tokens.css">
<style>body{margin:0;padding:20px 24px;background:var(--paper)}
.meta{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase;margin-bottom:14px}
.demo{border-top:1px solid var(--ink);padding-top:16px}
.eyebrow{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;color:var(--accent);text-transform:uppercase;margin:0}
h2{font-family:var(--font-sans);font-size:22px;font-weight:500;margin:8px 0 0;letter-spacing:-.02em}
.gap{height:24px}
.body{font-size:14px;line-height:1.6;color:var(--ink-2);margin:0}
.major{height:56px}
.label{font-family:var(--font-mono);font-size:9px;color:var(--ink-3);letter-spacing:.08em}
</style></head>
<body>
<div class="meta">Section rhythm · 16 / 24 / 40 / 64</div>
<div class="demo">
  <p class="eyebrow">Rhythm</p>
  <h2>본문 섹션 헤드</h2>
  <div class="gap"><div class="label" style="padding-top:8px">— 24px 로컬 갭</div></div>
  <p class="body">본문 사이 리듬. 12칸 그리드에 정렬합니다.</p>
  <div class="major"><div class="label" style="padding-top:24px">— 56px 메이저 섹션 갭</div></div>
  <p class="body">다음 섹션이 여기서 시작합니다.</p>
</div>
</body></html>
