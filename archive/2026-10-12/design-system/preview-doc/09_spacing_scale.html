<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../doc-tokens.css">
<style>body{margin:0;padding:20px 24px;background:var(--paper)}
.meta{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase;margin-bottom:14px}
.row{display:flex;align-items:center;gap:14px;padding:6px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.k{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);width:56px}
.v{font-family:var(--font-mono);font-size:11px;color:var(--ink);width:56px}
.bar{height:8px;background:var(--ink)}
</style></head>
<body>
<div class="meta">Base unit · 4px</div>
<div class="row"><div class="k">--s1</div><div class="v">4px</div><div class="bar" style="width:4px"></div></div>
<div class="row"><div class="k">--s2</div><div class="v">8px</div><div class="bar" style="width:8px"></div></div>
<div class="row"><div class="k">--s3</div><div class="v">12px</div><div class="bar" style="width:12px"></div></div>
<div class="row"><div class="k">--s4</div><div class="v">16px</div><div class="bar" style="width:16px"></div></div>
<div class="row"><div class="k">--s6</div><div class="v">24px</div><div class="bar" style="width:24px"></div></div>
<div class="row"><div class="k">--s10</div><div class="v">40px</div><div class="bar" style="width:40px"></div></div>
<div class="row"><div class="k">--s16</div><div class="v">64px</div><div class="bar" style="width:64px"></div></div>
</body></html>
