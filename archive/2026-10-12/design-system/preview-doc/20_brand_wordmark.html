<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../doc-tokens.css">
<style>body{margin:0;padding:24px;background:var(--paper)}
.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase;margin-bottom:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.cell{padding:20px;display:flex;align-items:center;justify-content:center;min-height:100px}
.cell+.cell{border-left:1px solid var(--line);background:var(--ink)}
.cell img{width:260px;height:auto;display:block}
.cap{font-family:var(--font-mono);font-size:9px;color:var(--ink-3);letter-spacing:.08em;margin-top:10px;text-align:center;text-transform:uppercase}
</style></head>
<body>
<div class="lbl">Wordmark — Athletics <em style="font-family:var(--font-serif);color:var(--accent)">Athlete</em> Club</div>
<div class="row">
  <div style="text-align:center"><div class="cell"><img src="../../../2026-09-21/design-system-handoff/assets/aac-wordmark-dark.png" alt="AAC dark on paper"></div><div class="cap">Dark on paper</div></div>
  <div style="text-align:center"><div class="cell"><img src="../../../2026-09-21/design-system-handoff/assets/aac-wordmark-light.png" alt="AAC light on ink"></div><div class="cap" style="color:var(--ink-3)">Light on ink</div></div>
</div>
</body></html>
