<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../doc-tokens.css">
<style>body{margin:0;padding:24px;background:var(--paper)}
.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase;margin-bottom:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{padding:14px;border:1px solid var(--line)}
.k{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.ok{color:var(--accent)}
.no{color:var(--ink-3)}
.card ul{margin:0;padding-left:16px;font-size:12px;line-height:1.6;color:var(--ink-2)}
.card li+li{margin-top:4px}
</style></head>
<body>
<div class="lbl">Brand DOs / DON'Ts</div>
<div class="row">
  <div class="card">
    <div class="k ok">DO</div>
    <ul>
      <li>웜 오프화이트 종이 + 1px 헤어라인</li>
      <li>세리프는 오프닝 스테이트먼트에만</li>
      <li>한글은 산세리프, 수치는 모노</li>
      <li>액센트 teal은 페이지당 1회</li>
    </ul>
  </div>
  <div class="card">
    <div class="k no">DON'T</div>
    <ul>
      <li>네온·형광, 무지개 로우</li>
      <li>둥근 카드, 큰 스티커, 이모지</li>
      <li>그림자·그라디언트·페이크 3D</li>
      <li>포스터형 대문자 한글 헤드라인</li>
      <li>프로모션 CTA·과장·느낌표</li>
    </ul>
  </div>
</div>
</body></html>
