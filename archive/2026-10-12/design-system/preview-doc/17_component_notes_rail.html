<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../doc-tokens.css">
<style>body{margin:0;padding:24px;background:var(--paper)}
.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase;margin-bottom:12px}
.notes{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.note{padding:14px 14px 14px 0;border-right:1px solid var(--line)}
.note+.note{padding-left:14px}
.note:last-child{border-right:0;padding-right:0}
.k{display:block;margin-bottom:8px;font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;color:var(--ink-3)}
.note strong{display:block;font-size:14px;font-weight:500;line-height:1.35}
.note p{margin:4px 0 0;font-size:11px;line-height:1.5;color:var(--ink-2)}
</style></head>
<body>
<div class="lbl">Notes rail — 한도·중복 기준</div>
<div class="notes">
  <div class="note"><span class="k">DUPLICATION</span><strong>최고액 1건</strong><p>같은 콘텐츠는 가장 높은 한 항목만 인정합니다.</p></div>
  <div class="note"><span class="k">STORY LIMIT</span><strong>월 10건</strong><p>스토리 태그 보상의 월별 한도입니다.</p></div>
  <div class="note"><span class="k">MONTHLY LIMIT</span><strong>월 100,000원</strong><p>선수 1인 기준 시범운영 총 한도입니다.</p></div>
</div>
</body></html>
